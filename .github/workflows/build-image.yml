name: BuildImage

on:
  push:
    tags:
    - 'v*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Build UI into internal/web/dist
      uses: ./.github/actions/setup-ui
      with:
        build: 'true'

    - name: Declare some variables
      id: vars
      shell: bash
      run: |
        echo "time=$(date +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"
        echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -p 1 -timeout 45m ./...

    - name: Test gofunction module
      working-directory: gofunction
      run: go test -short -timeout 10m ./...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.REGISTRY_URL }}/simplebased:${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.time }}