# SimpleBase 单实例配置示例
#
# 复制为 config.yaml（已被 .gitignore）并按环境修改。
# 加载顺序：代码默认值 → 本文件 → SIMPLEBASE_* 环境变量覆盖。
# 生产密钥不要写进本文件：用环境变量或 IAM 角色注入。
#
# 本地开发最短路径：
#   1. cp config.example.yaml config.yaml
#   2. 设置 dev_mode: true，并填写 auth.api_key_hash_secret（或 SIMPLEBASE_AUTH_APIKEY_SECRET）
#   3. ./build.sh dev
#      （脚本在缺少 config.yaml 时会从本文件生成一份本地副本，并把 log_level 设为 debug）

# ── HTTP ──────────────────────────────────────────────
http:
  address: ":8080"            # SIMPLEBASE_HTTP_ADDRESS；./build.sh --api-port 会覆盖
  read_timeout: 15s           # SIMPLEBASE_HTTP_READ_TIMEOUT
  write_timeout: 30s          # SIMPLEBASE_HTTP_WRITE_TIMEOUT
  idle_timeout: 60s           # SIMPLEBASE_HTTP_IDLE_TIMEOUT
  shutdown_timeout: 30s       # SIMPLEBASE_HTTP_SHUTDOWN_TIMEOUT；SIGTERM 优雅退出预算

# ── Instance ──────────────────────────────────────────
instance:
  id: "simplebase-dev-1"      # SIMPLEBASE_INSTANCE_ID（必填）；S3 对象前缀 / 日志身份
                              # 注意：改变 id 等价于换全新空存储；启动检测会拒绝（需走迁移流程）
  writable: true              # SIMPLEBASE_INSTANCE_WRITABLE；单写实例必须为 true
  lease:                      # per-database 写租约（multi-instance-consistency-plan §4.6）
    enabled: false            # SIMPLEBASE_INSTANCE_LEASE_ENABLED；仅单实例默认关闭，多实例须显式开启
    ttl: 30s                  # SIMPLEBASE_INSTANCE_LEASE_TTL；持租判活窗口
    renew_interval: 10s       # SIMPLEBASE_INSTANCE_LEASE_RENEW_INTERVAL；建议 ttl/3
    grace: 10s                # SIMPLEBASE_INSTANCE_LEASE_GRACE；观察式判活的等待窗口
    on_lost: release_db       # SIMPLEBASE_INSTANCE_LEASE_ON_LOST；release_db | exit

# 本地开发：DATA_PATH 落盘、旁路 S3、写入 Dev 种子 API key。生产必须 false。
dev_mode: true               # SIMPLEBASE_DEV_MODE

# ── Database / DuckLake ───────────────────────────────
database:
  engine: ducklake            # SIMPLEBASE_DB_ENGINE；仅允许 ducklake
  cache_dir: ".cache"         # SIMPLEBASE_DB_CACHE_DIR（必填）
  cache_max_bytes: 1073741824 # SIMPLEBASE_DB_CACHE_MAX_BYTES；1GiB LRU 上限（生产可改为 10GiB）
  cache_max_databases: 256    # SIMPLEBASE_DB_CACHE_MAX_DATABASES
  idle_timeout: 5m            # SIMPLEBASE_DB_IDLE_TIMEOUT；空闲库句柄关闭
  max_open: 8                 # SIMPLEBASE_DB_MAX_OPEN；同时打开的用户库数（非 sql.DB pool）
  ducklake:
    catalog_engine: duckdb    # SIMPLEBASE_DUCKLAKE_CATALOG_ENGINE；新部署推荐 duckdb；已有 SQLite 数据应配置 sqlite，切换需先备份并 reset
    memory_limit: 512MB       # SIMPLEBASE_DUCKLAKE_MEMORY_LIMIT
    threads: 2                # SIMPLEBASE_DUCKLAKE_THREADS
    extension_dir: ""         # SIMPLEBASE_DUCKLAKE_EXTENSION_DIR（生产预置扩展）
    data_inlining_row_limit: 1000 # SIMPLEBASE_DUCKLAKE_DATA_INLINING_ROW_LIMIT；小写入内联在本地 catalog，
                                   # 同步前刷出 Parquet；崩溃/丢盘可丢最近一个同步周期的提交。
    parquet_compression: zstd     # SIMPLEBASE_DUCKLAKE_PARQUET_COMPRESSION
    target_file_size: 64MB        # SIMPLEBASE_DUCKLAKE_TARGET_FILE_SIZE
    require_commit_message: false # SIMPLEBASE_DUCKLAKE_REQUIRE_COMMIT_MESSAGE
    catalog_sync:
      mode: interval          # interval | debounce；旧 sync_on_commit 自动降级 interval
      interval: 15s           # SIMPLEBASE_DUCKLAKE_SYNC_INTERVAL
      max_lag: 30s            # SIMPLEBASE_DUCKLAKE_SYNC_MAX_LAG；同步故障仍可能超出此目标
      debounce: 200ms         # SIMPLEBASE_DUCKLAKE_SYNC_DEBOUNCE_MS（旧模式兼容）
      keep_versions: 10       # SIMPLEBASE_DUCKLAKE_SYNC_KEEP_VERSIONS
    maintenance:
      checkpoint_interval: 1h # SIMPLEBASE_DUCKLAKE_MAINT_CHECKPOINT_INTERVAL
      expire_older_than: 7d   # SIMPLEBASE_DUCKLAKE_MAINT_EXPIRE_OLDER_THAN（支持 Nd）
      delete_older_than: 7d   # SIMPLEBASE_DUCKLAKE_MAINT_DELETE_OLDER_THAN；孤儿文件保留窗口（勿低于 7d）
      rewrite_delete_threshold: 0.95  # SIMPLEBASE_DUCKLAKE_MAINT_REWRITE_DELETE_THRESHOLD

# ── S3（非密钥）──────────────────────────────────────
# writable + 非 dev_mode 时 bucket/region/prefix 必填。
# access_key / secret_key 生产必须走环境变量；留空则使用 AWS 默认凭证链（IAM/IRSA）。
s3:
  endpoint: ""                # SIMPLEBASE_S3_ENDPOINT；完整 URL。腾讯云 COS 必须用区域级服务域名
                              # https://cos.<region>.myqcloud.com（勿用 bucket 级域名
                              # https://<bucket>-<appid>.cos.<region>.myqcloud.com，SDK 会把 bucket
                              # 再拼进 host/path 导致 List 被误路由为 GetObject）；MinIO 如 http://127.0.0.1:9000
  region: ""                  # SIMPLEBASE_S3_REGION
  bucket: ""                  # SIMPLEBASE_S3_BUCKET
  prefix: "simplebase"        # SIMPLEBASE_S3_PREFIX
  force_path_style: false     # SIMPLEBASE_S3_FORCE_PATH_STYLE；COS/AWS S3/R2/GCS 用 false（虚拟主机寻址），MinIO 用 true
  kms_key_id: ""              # SIMPLEBASE_S3_KMS_KEY_ID；SSE-KMS CMK id，非密钥材料
  # access_key: ""            # 禁止提交。SIMPLEBASE_S3_ACCESS_KEY
  # secret_key: ""            # 禁止提交。SIMPLEBASE_S3_SECRET_KEY

# ── System database ───────────────────────────────────
system_database:
  name: "simplebase-system"   # SIMPLEBASE_SYSTEM_DB_NAME
  metrics_flush_interval: 15s # SIMPLEBASE_METRICS_FLUSH_INTERVAL；besides 64 条缓冲
  log_flush_interval: 15s     # SIMPLEBASE_LOG_FLUSH_INTERVAL
  log_keep_days: 14           # SIMPLEBASE_LOG_KEEP_DAYS；种子 sys_log_retention（无行时）

# ── Auth ──────────────────────────────────────────────
auth:
  # 必填 HMAC 盐。生产：SIMPLEBASE_AUTH_APIKEY_SECRET；dev 可写在本地 config.yaml。
  api_key_hash_secret: ""

# ── LLM ───────────────────────────────────────────────
# 运行时密钥以 catalog CredentialRef 为准；以下为实例级兜底（catalog 无密钥时）。
# 不要自动发现 OPENAI_API_KEY 等未加前缀的环境变量。
llm:
  enabled: true               # SIMPLEBASE_LLM_ENABLED；false 则不构造 gateway
  agent_tool_protocol: auto   # auto | native | text；SIMPLEBASE_LLM_AGENT_TOOL_PROTOCOL
  agent_max_iterations: 8    # 1–20；SIMPLEBASE_LLM_AGENT_MAX_ITERATIONS
  agent_run_timeout: 180s    # 10s–15m；SIMPLEBASE_LLM_AGENT_RUN_TIMEOUT
  # SiliconFlow (OpenAI 兼容): provider=openai；SIMPLEBASE_LLM_PROVIDER_OPENAI_BASE_URL=https://api.siliconflow.cn/v1
  # SIMPLEBASE_LLM_PROVIDER_OPENAI_DEFAULT_MODEL=deepseek-ai/DeepSeek-V4-Flash
  # SIMPLEBASE_LLM_PROVIDER_OPENAI_API_KEY 仅存进程环境或 .env，不写入 YAML。
  # providers:
  #   openai:
  #     api_key: ""           # SIMPLEBASE_LLM_PROVIDER_OPENAI_API_KEY（生产走环境）
  #     base_url: ""          # SIMPLEBASE_LLM_PROVIDER_OPENAI_BASE_URL
  #     default_model: "gpt-4o-mini"  # SIMPLEBASE_LLM_PROVIDER_OPENAI_DEFAULT_MODEL
  #     allowed_models: ["gpt-4o-mini", "gpt-4o"]  # SIMPLEBASE_LLM_PROVIDER_OPENAI_ALLOWED_MODELS
  #     timeout: 60s          # SIMPLEBASE_LLM_PROVIDER_OPENAI_TIMEOUT
  # SIMPLEBASE_LLM_PROVIDERS=openai,anthropic 可增补 provider 名。

# ── Agent（云助手 CLI skill）──────────────────────────
# 代码默认 skills_cli 为 true。已有部署的 config.yaml 不自动改；要关闭：
#   agent.skills_cli: false
#   或 SIMPLEBASE_AGENT_SKILLS_CLI=false
agent:
  skills_cli: true            # SIMPLEBASE_AGENT_SKILLS_CLI
  cli_path: ""                # 空则使用 simplebased 同目录的 simplebase；SIMPLEBASE_AGENT_CLI_PATH
  delegation_ttl: 15m         # 1m–30m，0 表示 15m；SIMPLEBASE_AGENT_DELEGATION_TTL
  confirm_timeout: 2m         # 10s–10m，0 表示 2m；SIMPLEBASE_AGENT_CONFIRM_TIMEOUT

# ── Sandbox（云沙盒，microsandbox Cloud）──────────────
# 侧栏「自动化 → 云沙盒」与 /v1/projects/:id/sandboxes/** 接口；云 Agent 沙盒工具复用同一套。
sandbox:
  enabled: false              # SIMPLEBASE_SANDBOX_ENABLED
  backend: cloud              # cloud | fake（fake 为内存假后端，仅 dev_mode=true，用于 e2e）；SIMPLEBASE_SANDBOX_BACKEND
  api_url: ""                 # 空 = https://api.microsandbox.dev；SIMPLEBASE_SANDBOX_API_URL
  # api_key 生产只能来自 SIMPLEBASE_SANDBOX_API_KEY，YAML 非空会被拒绝
  image: "python:3.12-slim"   # 默认镜像；SIMPLEBASE_SANDBOX_IMAGE
  images:                     # 镜像白名单（逗号分隔：SIMPLEBASE_SANDBOX_IMAGES），须包含 image
    - "python:3.12-slim"
    - "node:22-alpine"
    - "alpine:3.20"
  cpus: 1                     # 单沙盒上限 1–4
  memory_mib: 256             # 128–4096
  max_duration: 30m           # VM 总寿命
  idle_timeout: 5m            # 空闲回收
  exec_timeout: 30s           # 单次命令默认时限
  exec_timeout_max: 300s      # API 可自定 timeout 的上限
  max_output_bytes: 65536
  max_file_bytes: 1048576
  max_per_project: 5          # 项目内未删除沙盒上限；SIMPLEBASE_SANDBOX_MAX_PER_PROJECT
  reap_interval: 5m           # 过期清理周期；0 = 关闭
  network: none               # none | public（public 为允许上限）
  workdir: /workspace

# ── Limits ────────────────────────────────────────────
limits:
  max_request_bytes: 1048576        # SIMPLEBASE_LIMITS_MAX_REQUEST_BYTES
  max_query_rows: 1000              # SIMPLEBASE_LIMITS_MAX_QUERY_ROWS
  query_timeout: 30s                # SIMPLEBASE_LIMITS_QUERY_TIMEOUT
  max_concurrent_queries: 64        # SIMPLEBASE_LIMITS_MAX_CONCURRENT_QUERIES
  max_batch_statements: 100         # SIMPLEBASE_LIMITS_MAX_BATCH_STATEMENTS
  max_sql_bytes: 65536              # SIMPLEBASE_LIMITS_MAX_SQL_BYTES

# ── Observability ─────────────────────────────────────
observability:
  log_level: info             # debug | info | warn | error；SIMPLEBASE_LOG_LEVEL
                              # ./build.sh dev 仅在 yaml/.env 都未设置时默认 debug
  log_format: json            # json | console（console 为 zap 控制台编码器，非 JSON）
  log_output: stderr          # stderr | stdout；SIMPLEBASE_LOG_OUTPUT
  metrics_path: /metrics      # SIMPLEBASE_METRICS_PATH
