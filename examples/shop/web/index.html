<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimpleBase 电商</title><h1>示例·电商</h1><button id="refresh">刷新商品</button><div id="products"></div><script>async function refresh(){const data=await(await fetch('/api/products')).json();document.querySelector('#products').replaceChildren(...data.map(p=>{const article=document.createElement('article');const title=document.createElement('h2');title.textContent=p.name;const img=document.createElement('img');img.src=p.image_url||'';img.width=64;img.alt=p.name;const info=document.createElement('p');info.textContent=`¥${(p.price_minor/100).toFixed(2)} · 库存 ${p.stock}`;article.append(title,img,info);return article}))}document.querySelector('#refresh').onclick=refresh;refresh()</script></html>
