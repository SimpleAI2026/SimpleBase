<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运维助理 · 示例</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fed'/%3E%3Ctext x='16' y='23' font-size='17' font-family='Helvetica,Arial' fill='%23fff' text-anchor='middle'%3E运%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink: #16202b; --ink2: #4d5b68; --ink3: #8b98a4; --line: #e4e9ee; --blue: #2f6fed; --bg: #f5f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", Helvetica, Arial, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--line); }
  header .inner { max-width: 1140px; margin: 0 auto; padding: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 0; font-size: 12px; color: var(--ink3); }
  header .spacer { flex: 1; }
  main { max-width: 1140px; margin: 0 auto; padding: 16px; }
  .panel { background: #fff; border-radius: 9px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .panel h2 .more { margin-left: auto; font-size: 12px; color: var(--ink3); font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--ink3); font-weight: 500; }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed #f0f3f6; }
  .row:last-child { border-bottom: none; }
  .row .value { color: var(--ink3); max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #eef2f7; color: var(--ink2); }
  .tag.warn { background: #fff3e0; color: #b26a00; }
  .tag.critical { background: #fdeaea; color: #c0271c; }
  .tag.ok { background: #e6f6ef; color: #12805c; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 7px 14px; color: var(--ink2); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  input { font: inherit; border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; }
  .empty { color: var(--ink3); text-align: center; padding: 16px 0; }
  .toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 5px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="inner">
  <div>
    <h1>运维助理</h1>
    <p>工单 → SLA 判定 → 附件与审计；只读 Key 与运行时 Key 分权</p>
  </div>
  <span class="spacer"></span>
  <span class="tag ok">项目 ex-ops01</span>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || 'GET',
    headers: { 'content-type': 'application/json' },
    body: options.body === undefined ? undefined : JSON.stringify(options.body)
  })
  const text = await res.text()
  let data
  try { data = text ? JSON.parse(text) : null } catch { data = text }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`)
  return data
}

let toastTimer
function toast(message) {
  const el = document.getElementById('toast')
  el.textContent = message
  el.classList.add('on')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200)
}

const STATUS_TEXT = { open: '待处理', closed: '已关闭' }

async function render() {
  const [tickets, platform] = await Promise.all([api('/api/tickets'), api('/api/platform')])
  const overdue = new Set((platform.sla_marks || []).filter(mark => mark.level === 'overdue').map(mark => mark.ticket_id))

  const ticketRows = tickets.map(ticket => `<tr>
    <td><code>${esc(String(ticket.id).slice(0, 12))}</code></td>
    <td>${esc(ticket.title)}</td>
    <td>${esc(ticket.priority || '-')}</td>
    <td>${esc(STATUS_TEXT[ticket.status] || ticket.status)}</td>
    <td>${esc(String(ticket.due_at || '').replace('T', ' ').slice(0, 16))}</td>
    <td>${overdue.has(ticket.id) ? '<span class="tag critical">逾期</span>' : '<span class="tag">未标记</span>'}</td>
  </tr>`).join('')

  const kvRows = (platform.kv || []).map(item => `<div class="row">
    <span><code>${esc(item.key)}</code> <span style="color:#8b98a4;font-size:12px">${esc(item.type)}${Number(item.ttl) > 0 ? ` · TTL ${item.ttl}s` : ''}</span></span>
    <span class="value">${esc(item.value || '')}</span>
  </div>`).join('')

  const objectRows = (platform.objects || []).map(item => `<div class="row">
    <span><code>${esc(item.key)}</code></span>
    <span class="value">${item.size ? `${(item.size / 1024).toFixed(1)} KB` : '—'}</span>
  </div>`).join('')

  const functionRows = (platform.functions || []).map(fn => `<div class="row">
    <span><code>${esc(fn.name)}</code> <span style="color:#8b98a4;font-size:12px">v${fn.latest_version}</span></span>
    <span class="value">${esc((fn.exports || []).join(', '))}</span>
  </div>`).join('')

  const cronRows = (platform.cron_jobs || []).map(job => `<div class="row">
    <span><code>${esc(job.name)}</code> <span style="color:#8b98a4;font-size:12px">${esc(job.cron_expr || job.schedule_kind)}</span></span>
    <span class="value">${esc(job.func_file)}.${esc(job.func_export)}</span>
  </div>`).join('')

  const triggerRows = (platform.triggers || []).map(item => `<div class="row">
    <span><code>${esc(item.kind)}</code> <span style="color:#8b98a4;font-size:12px">${esc(item.target || '(invoke)')}</span></span>
    <span class="value">${esc(item.func_file)}.${esc(item.func_export)} · ${item.enabled ? '启用' : '停用'}</span>
  </div>`).join('')

  const auditCalls = (platform.audit_calls || []).map(item => `<span class="tag">${esc(item.source)} ${item.c}</span>`).join(' ')
  const auditRows = (platform.audit || []).map(item => `<tr>
    <td><code>${esc(item.source)}</code></td>
    <td>${esc(item.action)}</td>
    <td>${esc(item.detail)}</td>
    <td>${esc(String(item.created_at).replace('T', ' ').slice(0, 19))}</td>
  </tr>`).join('')

  document.getElementById('app').innerHTML = `
    <div class="panel">
      <h2>工单 <span class="more">${tickets.length} 个</span></h2>
      ${ticketRows ? `<table><thead><tr><th>ID</th><th>标题</th><th>优先级</th><th>状态</th><th>截止</th><th>SLA</th></tr></thead><tbody>${ticketRows}</tbody></table>` : '<div class="empty">暂无工单</div>'}
      <div class="actions">
        <input id="ticketTitle" placeholder="新工单标题" style="min-width:220px">
        <button class="primary" id="createTicket">新建工单</button>
        <button id="runSla">运行 SLA 判定</button>
      </div>
      <div id="slaResult" style="margin-top:10px;font-size:13px;color:#4d5b68"></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Key-Value <span class="more">${(platform.kv || []).length} 个键</span></h2>
        ${kvRows || '<div class="empty">暂无键</div>'}
      </div>
      <div class="panel">
        <h2>附件对象 <span class="more">${(platform.objects || []).length} 个 · ops/attachments/</span></h2>
        ${objectRows || '<div class="empty">暂无对象</div>'}
        <div class="actions"><button id="uploadAttachment">上传 runbook 附件</button></div>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>云函数 <span class="more">${(platform.functions || []).length} 个</span></h2>
        ${functionRows || '<div class="empty">暂无函数</div>'}
      </div>
      <div class="panel">
        <h2>定时任务 <span class="more">${(platform.cron_jobs || []).length} 个</span></h2>
        ${cronRows || '<div class="empty">暂无任务</div>'}
        <div class="actions"><button id="runCron">立即触发 ops_sla_scan</button></div>
      </div>
    </div>

    <div class="panel">
      <h2>事件触发器 <span class="more">${(platform.triggers || []).length} 个 · 丢弃 ${platform.dropped || 0}</span></h2>
      ${triggerRows || '<div class="empty">暂无触发器</div>'}
      <div class="actions">
        <button class="primary" id="emitEvent">写一条运维事件</button>
        <button id="invokeHttp">invoke HTTP 触发器</button>
      </div>
    </div>

    <div class="panel">
      <h2>触发器审计 <span class="more">${platform.audit_total || 0} 条 ${auditCalls}</span></h2>
      ${auditRows ? `<table><thead><tr><th>来源</th><th>动作</th><th>详情</th><th>时间</th></tr></thead><tbody>${auditRows}</tbody></table>` : '<div class="empty">暂无记录，先新建工单或上传附件</div>'}
    </div>`
}

document.addEventListener('click', async event => {
  const id = event.target.id
  if (!id) return
  const button = event.target
  const run = async (message, action) => {
    button.disabled = true
    try {
      await action()
      toast(message)
      await new Promise(resolve => setTimeout(resolve, 1200))
      await render()
    } catch (error) {
      toast(error.message)
    }
    button.disabled = false
  }

  if (id === 'createTicket') {
    const title = document.getElementById('ticketTitle').value.trim()
    await run('工单已创建，触发器会回调审计', () => api('/api/tickets', { method: 'POST', body: { title: title || '示例工单', priority: 'high' } }))
    return
  }
  if (id === 'runSla') {
    button.disabled = true
    try {
      const data = await api('/api/sla/evaluate', { method: 'POST', body: {} })
      toast('SLA 判定完成')
      await render()
      // render() 会重建 DOM，结果文案要在重绘之后再写入。
      document.getElementById('slaResult').innerHTML = `sla.Evaluate v${data.version} → ${esc(data.summary)} <span class="tag ${esc(data.summary_level)}">${esc(data.summary_level)}</span>`
    } catch (error) { toast(error.message) }
    button.disabled = false
    return
  }
  if (id === 'uploadAttachment') { await run('附件已上传', () => api('/api/platform/upload', { method: 'POST', body: { key: `ops/attachments/runbook-${Date.now()}.txt` } })); return }
  if (id === 'emitEvent') { await run('运维事件已写入', () => api('/api/platform/emit-event', { method: 'POST', body: { detail: '来自运维页的演示事件' } })); return }
  if (id === 'invokeHttp') { await run('HTTP 触发器已入队', () => api('/api/platform/invoke-trigger', { method: 'POST', body: {} })); return }
  if (id === 'runCron') { await run('定时任务已触发', () => api('/api/platform/run-cron', { method: 'POST', body: {} })); return }
})

render().catch(error => {
  document.getElementById('app').innerHTML = `<div class="panel"><div class="empty">加载失败：${esc(error.message)}</div></div>`
})
</script>
</body>
</html>
