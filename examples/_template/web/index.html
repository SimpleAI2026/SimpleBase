<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__name__ · SimpleBase 示例</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>__name__</div>
    <nav>数据库 · KV · 云函数 · 定时任务</nav>
  </header>
  <main class="layout">
    <section class="hero">
      <h1>事项清单</h1>
      <p>由 SimpleBase 用户数据库存储事项，项目 KV 记录访问热度；每小时定时任务经云函数汇总窗口内新增数量。</p>
      <p class="meta">本页面不含任何 SimpleBase Key，全部请求走本地可信后端。</p>
    </section>
    <section class="panel">
      <h2>新增事项</h2>
      <form id="item-form">
        <input id="title" maxlength="80" placeholder="输入事项标题（不超过 80 字符）" autocomplete="off" required>
        <button type="submit">添加</button>
      </form>
      <p id="form-tip" class="tip" role="status"></p>
    </section>
    <section class="panel">
      <h2>事项与热度</h2>
      <p class="stat">访问计数：<strong id="views">-</strong></p>
      <ul id="item-list" class="list"></ul>
      <p id="empty-tip" class="tip">暂无事项，添加第一条试试。</p>
    </section>
    <section class="panel">
      <h2>小时汇总（云函数 / 定时任务）</h2>
      <ul id="stats-list" class="list small"></ul>
      <p id="stats-empty" class="tip">暂无汇总；发布定时任务并由 worker 消费后显示。</p>
    </section>
  </main>
  <footer>本地示例仅监听 127.0.0.1；前端构建产物仅上传项目私有对象存储，不代表公开网站上线。</footer>
  <script src="./app.js"></script>
</body>
</html>
