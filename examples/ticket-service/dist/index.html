<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工单指挥台 · SimpleBase</title><link rel="stylesheet" href="./style.css"></head><body><header><div class="logo">/ PULSE <small>OPS WORKSPACE</small></div><span>工单工作台　·　LOCAL DEMO</span></header><main><section class="intro"><div><span class="tag">WORKFLOW / SIMPLEBASE</span><h1>让每个问题，<br><em>都有回应。</em></h1><p>创建、跟踪和解决工单，用清晰的流程守护每一个重要时刻。</p></div><div class="intro-card"><div>⚡</div><strong>行动始于此刻</strong><span>工作有序 · 进展可见</span></div></section><div class="columns"><section class="panel"><div class="heading"><span class="tag">01 / CREATE</span><h2>新建工单</h2></div><form id="form"><label>问题标题<input id="title" maxlength="120" minlength="2" placeholder="请描述你遇到的问题" required></label><label>优先级<select id="priority"><option value="1">紧急 · 1 小时</option><option value="2" selected>普通 · 2 小时</option><option value="3">较低 · 3 小时</option></select></label><button>创建工单 ↗</button></form></section><section class="panel"><div class="heading"><span class="tag">02 / TRACK</span><h2>我的工单</h2></div><div id="tickets">正在加载…</div></section></div><section class="panel alerts"><div class="heading"><span class="tag">03 / REVIEW</span><h2>超期提醒</h2></div><div id="alerts">正在加载…</div></section><p id="status" role="status" aria-live="polite"></p></main><footer>PULSE / 工单工作台 <span>SimpleBase · 数据库 / KV / 云函数 / 定时任务</span></footer><script type="module" src="./app.js"></script></body></html>
